<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 SST & English Notes Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif
}

body{
background:#f4f6fb;
color:#222;
transition:0.3s;
min-height:100vh;
}

.dark{
background:#0f172a;
color:#e5e7eb
}

header{
background:linear-gradient(120deg,#4f46e5,#06b6d4);
color:white;
text-align:center;
padding:18px;
font-size:22px;
font-weight:bold;
}

.topbar{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:10px;
justify-content:space-between;
}

.searchBox{
padding:10px;
width:250px;
max-width:100%;
border-radius:8px;
border:none;
}

.btn{
padding:10px;
border:none;
border-radius:8px;
background:#4f46e5;
color:white;
cursor:pointer;
}

.tabs{
display:flex;
flex-wrap:wrap;
gap:8px;
justify-content:center;
margin:10px;
}

.tab{
padding:8px 12px;
background:white;
border-radius:20px;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.activeTab{
background:#4f46e5;
color:white;
}

.container{
display:grid;
grid-template-columns:260px 1fr;
gap:10px;
padding:10px;
}

.chapterBox,
.notes{
background:white;
border-radius:10px;
padding:10px;
min-height:60vh;
overflow:auto;
}

.chapterBtn{
width:100%;
padding:10px;
margin-bottom:6px;
border:none;
background:#eef2ff;
border-radius:6px;
cursor:pointer;
}

embed{
width:100%;
height:70vh;
}

.fullscreenPDF{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:white;
z-index:9999;
padding:10px;
}

footer{
background:#111;
color:#ddd;
text-align:center;
padding:20px;
margin-top:20px;
}

/* mobile */

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

embed{
height:65vh;
}

}

</style>
</head>

<body>

<header>📘 Class 10 SST & English Notes Hub</header>

<div class="topbar">
<input id="search" class="searchBox" placeholder="Search chapter">
<button class="btn" onclick="toggleDark()">Dark</button>
</div>

<div class="tabs">
<div class="tab activeTab" onclick="showSubject('history',this)">History</div>
<div class="tab" onclick="showSubject('civics',this)">Civics</div>
<div class="tab" onclick="showSubject('geography',this)">Geography</div>
<div class="tab" onclick="showSubject('economics',this)">Economics</div>
<div class="tab" onclick="showSubject('english',this)">English</div>
</div>

<div class="container">

<div id="chapters" class="chapterBox"></div>

<div id="notes" class="notes">
<h2>Welcome</h2>
Select chapter
</div>

</div>

<script>

const data={

history:{
"Rise of Nationalism":"pdf/rise-nationalism-europe.pdf",
"Nationalism in India":"pdf/nationalism-india.pdf"
},

civics:{
"Power Sharing":"pdf/power-sharing.pdf"
},

geography:{
"Resources":"pdf/resources-dev.pdf"
},

economics:{
"Development":"pdf/development.pdf"
},

english:{
"Grammar":"pdf/english-language-grammar.pdf"
}

}

let currentSubject="history"

const chapterBox=document.getElementById("chapters")
const notesBox=document.getElementById("notes")

function showSubject(s,el){

currentSubject=s

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("activeTab"))

el.classList.add("activeTab")

loadChapters()

}

function loadChapters(){

chapterBox.innerHTML=""

Object.keys(data[currentSubject]).forEach(ch=>{

let b=document.createElement("button")

b.className="chapterBtn"

b.innerText=ch

b.onclick=()=>showNotes(ch,currentSubject)

chapterBox.appendChild(b)

})

}

function showNotes(ch,sub){

let pdf=data[sub][ch]

notesBox.innerHTML=`

<h2>${ch}</h2>

<div id="pdfContainer">

<button class="btn"
onclick="toggleFullscreen()">
Full Screen
</button>

<br><br>

<embed
src="${pdf}"
type="application/pdf"
/>

</div>

<br>

<a class="btn"
href="${pdf}"
target="_blank">
Open / Download PDF
</a>

`

}

function toggleFullscreen(){

let e=document.getElementById("pdfContainer")

e.classList.toggle("fullscreenPDF")

}

document
.getElementById("search")
.addEventListener("input",e=>{

let t=e.target.value.toLowerCase()

chapterBox.innerHTML=""

if(!t){loadChapters();return}

for(let s in data){

for(let c in data[s]){

if(c.toLowerCase().includes(t)){

let b=document.createElement("button")

b.className="chapterBtn"

b.innerText=c

b.onclick=()=>showNotes(c,s)

chapterBox.appendChild(b)

}

}

}

})

function toggleDark(){
document.body.classList.toggle("dark")
}

loadChapters()

</script>


<script>

/* disable inspect */

document.addEventListener(
"contextmenu",
e=>e.preventDefault()
)

document.addEventListener(
"keydown",
e=>{

if(e.key==="F12") e.preventDefault()

if(e.ctrlKey&&e.key==="u") e.preventDefault()

if(e.ctrlKey&&e.shiftKey&&e.key==="I")
e.preventDefault()

}
)

</script>


<footer>

Contact<br>
rishabhvachheta@gmail.com

</footer>

</body>
</html>
